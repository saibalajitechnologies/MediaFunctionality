# render.yaml - Blueprint for .NET Core Web API on Render

services:
  - type: web
    name: media-api
    runtime: dotnet8       # Correct runtime for .NET 8
    plan: free
    branch: videorefactor
    buildCommand: dotnet restore && dotnet build --configuration Release
    startCommand: dotnet run --urls "http://0.0.0.0:10000"
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
