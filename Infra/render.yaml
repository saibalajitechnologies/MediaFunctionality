services:
  - type: web
    name: media-api
    plan: free
    branch: main            # Your branch name with the API code
    buildCommand: dotnet restore && dotnet publish -c Release -o ./publish
    startCommand: dotnet ./publish/FunctionalitiesWebAPI.dll
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
